# One server (a VPS) running everything: PostgreSQL, the API, the storefront and Caddy for HTTPS.
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store -d store']
      interval: 10s
      retries: 10

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://store:${DB_PASSWORD}@db:5432/store
      APP_URL: https://${DOMAIN}
      WEB_ORIGIN: https://${DOMAIN}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      TRUST_PROXY: '1'
      UPLOAD_DIR: /app/.data/uploads
      OUTBOX_DIR: /app/.data/outbox
    volumes:
      - uploads:/app/.data

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_INDEXABLE: ${INDEXABLE:-0}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000
      PROXY_KEY: ${PROXY_KEY:?set PROXY_KEY}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  uploads:
  caddy:
